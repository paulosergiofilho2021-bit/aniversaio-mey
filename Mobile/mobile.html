<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maysa</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Poppins:wght@300;400;500&display=swap');


*{box-sizing: border-box;}

html{
    overflow-x: hidden;
}
body {
    margin: 0;
    padding: 0;
    background: pink;
    min-height: 100vh;
    position: relative;
    font-family: 'Poppins', sans-serif;
    overflow-x: hidden;
}
.emoji {
    position: fixed;
    top: -100px;
    pointer-events: none;
    z-index: -1;
}
.name {
    position: relative;
    height: 300px;
    width: 100%;
    display: flex;
    justify-content: center;
    align-items: flex-end;
}
.container-name{
    gap: 10px;
    anchor-name: --name;
    display: flex;
}
.container {
    color: rgb(170, 0, 255);
    font-size: 100px;
    font-family: 'Cormorant Garamond', serif;    font-style: italic;
    font-weight: 800;
    pointer-events: none;
}
.subline {
    height: 3px;
    margin-top: 20px;
    width: 330px;
    background-color: rgb(196, 63, 196);
    position: absolute;
    position-area: bottom center;
    position-anchor: --name;
    border-radius: 5px;
}
.aura{
    height: 500px;
    width: 500px;
    background-color: rgb(255, 89, 255);
    opacity: 0.3;
    position: fixed;
    z-index: -2;
    border-radius: 50%;
    filter: blur(80px);
    translate: -40% -40%;
    animation: aura 30s infinite alternate;
}
.phrase {
    position: absolute;
    position-anchor: --name;
    position-area: top center;
    width: 400px;
    text-align: center;
    color: #fcd34d;
    letter-spacing: 3px;
    filter: blur(0);
    animation: phrase linear 2s;
}
@keyframes aura {
    to{
        transform: scale(5);
    }
}
@keyframes phrase {
    from{
        filter: blur(5px);
    }
    to{
        filter: blur(0);
    }
}
    </style>
</head>
<body>
    <div class="aura"></div>
    <div class="name">
        <div class="container-name">
            <div class="phrase">Um dia só seu!</div>
            <div class="container">M</div>
            <div class="container">a</div>
            <div class="container">y</div>
            <div class="container">s</div>
            <div class="container">a</div>
        </div>
    </div>
    <div class="subline"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script>
gsap.from(".subline", {
    opacity: 0,
    width: 0,
    duration: 3.5,
    delay: 1.3
});
const tl = gsap.timeline();
tl.from(".container", {
    y: 150,
    duration: 0.8,
    opacity: 0,
    stagger: 0.1,
    ease: "back.out(2.5)"
})
function emoji () {
    let p = document.createElement("p");
    document.body.appendChild(p);
    p.classList.add("emoji");
    let emojis = ["❤️", "🌸","💐","🎉","🎁"];
    let randomEmoji = emojis[Math.floor(Math.random() * emojis.length)];
    const tl = gsap.timeline();
    p.textContent = randomEmoji;
    tl.fromTo(p,
        {
            x: Math.random() * window.innerWidth,
            scale: Math.random() * 1.5 + 2,
        },
        {
            duration: (Math.random() * 10) + 10,
            y: window.innerHeight + 200,
            rotate: 360,
            ease: "none",
        }).
        to(p, {
            scale: 0,
            opacity: 0,
            ease: "none",
            onComplete: () => {
                p.remove();
            }
        });
};
setInterval(emoji, 800);
    </script>
</body>
</html>
